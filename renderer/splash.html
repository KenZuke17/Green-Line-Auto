<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Green Line Auto Service</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: Inter, Segoe UI, Arial, sans-serif;
        background: transparent;
        color: #0f172a;
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      .card {
        width: 420px;
        max-width: 90vw;
        padding: 24px 20px;
        text-align: center;
        background: transparent;
      }
      img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        margin-bottom: 16px;
      }
      h1, p, .bar {
        display: none;
      }
      .bar {
        margin: 18px auto 0;
        height: 8px;
        width: 220px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, #10b981 0%, #0ea5e9 100%);
        animation: pulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        from { transform: translateX(-25%); }
        to { transform: translateX(125%); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="./src/assets/logo.png" alt="Green Line Auto Service logo" />
      <h1>Green Line Auto Service</h1>
      <p>Loading your workshop dashboard…</p>
      <div class="bar"><span></span></div>
    </div>
  </body>
</html>
